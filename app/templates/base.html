<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Webhost" }}</title>
    <link rel="stylesheet" href="/static/app.css?v=20260515-badge-link" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/sites">Webhost</a>
      <nav class="topnav">
        {% if admin_email %}
          <span class="admin-email">{{ admin_email }}</span>
          <a class="button secondary small" href="/logout">ログアウト</a>
        {% endif %}
      </nav>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    <div id="toast" class="toast" hidden></div>
  </body>
</html>
